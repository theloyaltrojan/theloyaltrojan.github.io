  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 32px 20px;

  .handle span { color: var(--accent); }
  a.card { display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: 4px;
           color: inherit; text-decoration: none; transition: border-color .15s, background .15s; }
  a.card:hover { border-color: var(--accent); background: rgba(242,195,24,0.05); }
  a.card b { display: block; font-size: 18px; letter-spacing: -0.01em; }
  a.card span { color: var(--muted); font-size: 14px; }
  footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  footer a { color: inherit; }
  footer a:hover { color: var(--ink); }
